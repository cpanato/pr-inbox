version: 2

project_name: pr-inbox

before:
  hooks:
    - npm ci
    - npm run build

builds:
  - id: pr-inbox
    main: ./cmd/pr-inbox
    binary: pr-inbox
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github-native

homebrew_casks:
  - name: pr-inbox
    repository:
      owner: cpanato
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/cpanato/pr-inbox
    description: Local inbox for GitHub pull requests and GitLab merge requests
    license: Apache-2.0
    skip_upload: auto # don't publish prereleases
    hooks:
      post:
        # The binaries aren't notarized; clear quarantine so macOS runs them.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/pr-inbox"]
          end
